name: CI
on:
  push:
    branches: [main, master, UI-redesign, dev]
  pull_request:
    branches: [main, master, dev]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: iqlrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only-ci-password@localhost:5432/iqlrs_test
      TEST_DATABASE_URL: postgresql://postgres:test-only-ci-password@localhost:5432/iqlrs_test
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-never-use-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pytest ruff
      - run: ruff check app/
      - run: python -m app.migrate
      - run: python -m app.migrate
      - run: pytest tests/ -v
