services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_PROXY_URL: http://backend:8000
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://iqlrs:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/quantumlearn
      TTS_CACHE_PATH: /app/.cache/narration.sqlite3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - narration_cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 5

  migrate:
    build: ./backend
    profiles: ["tools"]
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://iqlrs:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/quantumlearn
    command: ["python", "-m", "app.migrate"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iqlrs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: quantumlearn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iqlrs -d quantumlearn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  narration_cache:
  caddy_data:
  caddy_config:
